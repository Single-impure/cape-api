<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin – Obscure</title>
<style>
  :root { --bg:#0e0f13; --card:#171921; --line:#2a2d3a; --text:#e9eaf0; --muted:#8e90a0; --accent:#bb8ec1; --ok:#6fd48a; --err:#ff7a7a; }
  * { box-sizing: border-box; }
  body { margin:0; padding:24px; background:var(--bg); color:var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width:960px; margin:0 auto; }
  h1 { margin:0 0 16px; font-size:22px; } h1 span { color:var(--accent); }
  h2 { margin:0 0 12px; font-size:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:16px; }
  .hidden { display:none; }
  input { padding:9px 10px; border-radius:8px; border:1px solid var(--line); background:#0f1118; color:var(--text); font-size:14px; }
  input:focus { outline:2px solid var(--accent); border-color:transparent; }
  button { padding:9px 12px; border:0; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; color:#1a1020; background:var(--accent); }
  button.ghost { background:transparent; color:var(--text); border:1px solid var(--line); }
  button.danger { background:var(--err); }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .tabs { display:flex; gap:8px; margin-bottom:16px; }
  .tabs button.on { background:var(--accent); color:#1a1020; } .tabs button:not(.on) { background:transparent; color:var(--text); border:1px solid var(--line); }
  .scroll { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--muted); font-weight:500; }
  td .row { gap:6px; }
  #msg { min-height:20px; margin:0 0 12px; font-size:14px; } #msg.ok { color:var(--ok); } #msg.err { color:var(--err); }
  textarea { width:100%; height:120px; margin-top:10px; padding:10px; border-radius:8px; border:1px dashed var(--accent); background:#0f1118; color:var(--text); font-family:ui-monospace, Menlo, Consolas, monospace; font-size:13px; }
  .muted { color:var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <h1><span>Obscure</span> admin</h1>

  <div id="login" class="card">
    <h2>Entrar</h2>
    <div class="row">
      <input id="tok" type="password" placeholder="ADMIN_TOKEN" autocomplete="off" style="flex:1;min-width:220px">
      <button id="enter">Entrar</button>
    </div>
    <p class="muted" style="font-size:12px;margin:10px 0 0">O token fica só nesta aba (sessionStorage) e some ao fechar.</p>
  </div>

  <div id="app" class="hidden">
    <div class="row" style="margin-bottom:16px"><button id="out" class="ghost" style="margin-left:auto">Sair</button></div>
    <div id="msg" role="status"></div>

    <div class="card">
      <h2>Criar conta</h2>
      <div class="row">
        <input id="nuser" maxlength="16" placeholder="Usuário" autocomplete="off" spellcheck="false" style="width:170px" aria-label="Usuário">
        <input id="npass" type="text" placeholder="Senha (vazio = gerar)" autocomplete="off" style="width:190px" aria-label="Senha">
        <input id="ndays" type="number" min="0" placeholder="Dias (vazio = vitalícia)" style="width:190px" aria-label="Dias">
        <button id="ncreate">Criar</button>
      </div>
      <div id="secretBox" class="hidden">
        <textarea id="secret" readonly></textarea>
        <p class="muted" style="font-size:12px;margin:8px 0 0">Copie e envie agora: a senha não fica salva em texto e não aparece de novo.</p>
      </div>
    </div>

    <div class="card scroll">
      <h2>Usuários</h2>
      <table><thead><tr><th>Usuário</th><th>HWID</th><th>Expira</th><th>Último login</th><th>Status</th><th>Ações</th></tr></thead><tbody id="usersBody"></tbody></table>
    </div>
  </div>
</div>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  let TOKEN = sessionStorage.getItem('adm') || '';

  const say = (m, k) => { $('msg').textContent = m || ''; $('msg').className = k || ''; };
  const fmt = (d) => (d ? new Date(d).toLocaleString('pt-BR') : '—');

  async function api(method, path, body) {
    const r = await fetch('/admin/api' + path, {
      method,
      headers: { Authorization: 'Bearer ' + TOKEN, ...(body ? { 'Content-Type': 'application/json' } : {}) },
      body: body ? JSON.stringify(body) : undefined,
    });
    const j = await r.json().catch(() => ({}));
    if (r.status === 401) { logout(); throw new Error('Token inválido.'); }
    if (!r.ok) throw new Error(j.error || 'Erro ' + r.status);
    return j;
  }

  const el = (tag, text, cls) => { const e = document.createElement(tag); if (text != null) e.textContent = text; if (cls) e.className = cls; return e; };
  const cell = (tr, text) => { tr.appendChild(el('td', text)); };
  function btn(label, cls, fn) {
    const b = el('button', label, cls);
    b.addEventListener('click', async () => { try { await fn(); } catch (e) { say(e.message, 'err'); } });
    return b;
  }
  function showSecret(text) { $('secret').value = text; $('secretBox').classList.remove('hidden'); }

  async function loadUsers() {
    const { users } = await api('GET', '/users');
    const tb = $('usersBody'); tb.replaceChildren();
    for (const u of users) {
      const tr = el('tr');
      cell(tr, u.username); cell(tr, u.hwid_bound ? 'vinculado' : 'livre');
      cell(tr, u.expires_at ? fmt(u.expires_at) : 'vitalícia'); cell(tr, fmt(u.last_login));
      cell(tr, u.banned ? 'banido' : (u.expires_at && new Date(u.expires_at) < new Date() ? 'expirado' : 'ativo'));
      const td = el('td'), row = el('div', null, 'row');

      row.appendChild(btn('Reset HWID', 'ghost', async () => {
        if (!confirm('Resetar o HWID de ' + u.username + '? O próximo login vincula o PC novo.')) return;
        await api('POST', '/users/' + u.id + '/reset-hwid'); say('HWID de ' + u.username + ' resetado.', 'ok'); loadUsers();
      }));
      row.appendChild(btn('Nova senha', 'ghost', async () => {
        if (!confirm('Gerar nova senha para ' + u.username + '? A sessão atual cai.')) return;
        const r = await api('POST', '/users/' + u.id + '/reset-password');
        showSecret('Usuário: ' + u.username + '\nNova senha: ' + r.password); say('Nova senha gerada.', 'ok');
      }));
      row.appendChild(btn('+30 dias', 'ghost', async () => {
        const r = await api('POST', '/users/' + u.id + '/extend', { days: 30 });
        say(r.ok ? 'Licença estendida.' : 'Licença vitalícia não precisa de extensão.', r.ok ? 'ok' : 'err'); loadUsers();
      }));
      row.appendChild(u.banned
        ? btn('Desbanir', 'ghost', async () => { await api('POST', '/users/' + u.id + '/unban'); loadUsers(); })
        : btn('Banir', 'ghost', async () => {
            if (!confirm('Banir ' + u.username + '?')) return;
            await api('POST', '/users/' + u.id + '/ban'); loadUsers();
          }));
      row.appendChild(btn('Excluir', 'danger', async () => {
        if (prompt('Excluir a conta "' + u.username + '" de vez? Isso não pode ser desfeito.\nDigite o nome do usuário para confirmar:') !== u.username) return;
        await api('DELETE', '/users/' + u.id); say('Conta ' + u.username + ' excluída.', 'ok'); loadUsers();
      }));

      td.appendChild(row); tr.appendChild(td); tb.appendChild(tr);
    }
  }

  function logout() {
    TOKEN = ''; sessionStorage.removeItem('adm');
    $('secret').value = ''; $('secretBox').classList.add('hidden');
    $('app').classList.add('hidden'); $('login').classList.remove('hidden'); $('tok').value = '';
  }

  async function enter() {
    TOKEN = $('tok').value.trim() || TOKEN;
    try {
      await api('GET', '/ping');
      sessionStorage.setItem('adm', TOKEN);
      $('login').classList.add('hidden'); $('app').classList.remove('hidden');
      say(''); await loadUsers();
    } catch (e) { alert(e.message); }
  }

  $('enter').addEventListener('click', enter);
  $('tok').addEventListener('keydown', (e) => { if (e.key === 'Enter') enter(); });
  $('out').addEventListener('click', logout);

  $('ncreate').addEventListener('click', async () => {
    try {
      const d = $('ndays').value.trim();
      const username = $('nuser').value.trim();
      const r = await api('POST', '/users', { username, password: $('npass').value, days: d ? Number(d) : null });
      showSecret('Usuário: ' + username + '\nSenha: ' + (r.password || $('npass').value));
      say('Conta ' + username + ' criada.', 'ok');
      $('nuser').value = $('npass').value = $('ndays').value = '';
      loadUsers();
    } catch (e) { say(e.message, 'err'); }
  });

  if (TOKEN) enter();
})();
</script>
</body>
</html>
